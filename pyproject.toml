[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-strix"
version = "0.1.0"
description = "Laya decision inference on the AMD XDNA2 NPU"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Runtime needs the official `laya` package for the sequence builder, typed
# answers and calibration.  It deliberately does NOT depend on the `onnx`
# extra: on the NPU host `onnxruntime` must be AMD's VitisAI build, and a
# stray PyPI `onnxruntime` would silently replace it.
dependencies = [
  "laya==0.4.11",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local export / CPU parity only.
export = [
  "laya[onnx]==0.4.11",
  "torch>=2.9",
  "onnx>=1.16",
  "onnxscript>=0.4",
  "onnxruntime>=1.20",
  "onnxsim>=0.4",
  "safetensors>=0.4",
  "transformers>=4.48",
  "huggingface_hub>=0.20",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
laya-npu = "laya_strix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_strix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
